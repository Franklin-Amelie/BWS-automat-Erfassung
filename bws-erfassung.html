<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BWS Erfassung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F1F2; --surface:#FFFFFF; --surface-2:#F6F6F7; --ink:#39393F; --muted:#6C6C74; --line:#D5D5D9;
  --primary:#39393F; --primary-ink:#FFFFFF;
  --accent:#F9AE0B; --accent-ink:#39393F; --accent-soft:#FEF2D4; --accent-text:#8A5E00;
  --danger:#B42318;
  --grid:rgba(57,57,63,.07);
  --overlay:rgba(30,30,34,.55);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#232327; --surface:#2D2D33; --surface-2:#35353C; --ink:#F0F0F2; --muted:#A8A8B0; --line:#47474F;
    --primary:#F9AE0B; --primary-ink:#2A2A2F;
    --accent:#F9AE0B; --accent-ink:#2A2A2F; --accent-soft:#4A3A15; --accent-text:#FBC24A;
    --danger:#FF8A7A;
    --grid:rgba(249,174,11,.07);
    --overlay:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#232327; --surface:#2D2D33; --surface-2:#35353C; --ink:#F0F0F2; --muted:#A8A8B0; --line:#47474F;
  --primary:#F9AE0B; --primary-ink:#2A2A2F;
  --accent:#F9AE0B; --accent-ink:#2A2A2F; --accent-soft:#4A3A15; --accent-text:#FBC24A;
  --danger:#FF8A7A;
  --grid:rgba(249,174,11,.07);
  --overlay:rgba(0,0,0,.65);
  color-scheme:dark;
}
:root[data-firma="bfu"]{
  --bg:#F1F3F7; --surface:#FFFFFF; --surface-2:#F5F6F9; --ink:#040506; --muted:#5D6472; --line:#D2D7E1;
  --primary:#2B4B9C; --primary-ink:#FFFFFF;
  --accent:#F39200; --accent-ink:#040506; --accent-soft:#FDEBCF; --accent-text:#8C5300;
  --danger:#B42318; --grid:rgba(43,75,156,.08); --overlay:rgba(4,5,6,.55);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root[data-firma="bfu"]:not([data-theme="light"]){
    --bg:#0E1220; --surface:#171C2C; --surface-2:#1E2436; --ink:#ECEFF6; --muted:#A1A9BC; --line:#343C55;
    --primary:#8FA8EA; --primary-ink:#0B1020;
    --accent:#F39200; --accent-ink:#040506; --accent-soft:#4A3010; --accent-text:#FFB347;
    --danger:#FF8A7A; --grid:rgba(143,168,234,.08); --overlay:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-firma="bfu"][data-theme="dark"]{
  --bg:#0E1220; --surface:#171C2C; --surface-2:#1E2436; --ink:#ECEFF6; --muted:#A1A9BC; --line:#343C55;
  --primary:#8FA8EA; --primary-ink:#0B1020;
  --accent:#F39200; --accent-ink:#040506; --accent-soft:#4A3010; --accent-text:#FFB347;
  --danger:#FF8A7A; --grid:rgba(143,168,234,.08); --overlay:rgba(0,0,0,.65);
  color-scheme:dark;
}
:root[data-firma="bfu"] h1,:root[data-firma="bfu"] h2{font-family:Barlow,system-ui,sans-serif;font-weight:500;letter-spacing:0}
.firmsel{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.firmsel button{min-height:56px;border:2px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600;cursor:pointer}
.firmsel button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary);color:var(--primary-ink)}
.firm{font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2{font-family:"Barlow Semi Condensed",Barlow,system-ui,sans-serif;font-weight:700;letter-spacing:.005em}
h1{font-size:1.75rem;line-height:1.15;margin:0}
h2{font-size:1.2rem;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:.75rem;min-height:56px;padding:.4rem 1rem;background:var(--surface);border-bottom:3px solid var(--accent)}
.bar .title{flex:1;min-width:0;font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:none;color:var(--ink);font-weight:600;padding:.5rem .25rem;min-height:44px;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:1.25rem 1rem 2rem}
.wrap.withbar{padding-bottom:7.5rem}
.stack>*+*{margin-top:1.5rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:.92rem;max-width:68ch}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:46px;padding:.55rem 1.05rem;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{min-height:38px;padding:.35rem .8rem;font-size:.92rem}
.btn.big{min-height:64px;font-size:1.1rem;flex:1}

.list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.25rem 1rem;width:100%;text-align:left;padding:.85rem 1rem;border:0;background:none;cursor:pointer;min-height:64px}
.lrow:active{background:var(--surface-2)}
.lrow .key{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:1.25rem;min-width:3.2rem;padding-left:.6rem;border-left:4px solid var(--accent)}
.lrow .main{min-width:0}
.lrow .main strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .main span{color:var(--muted);font-size:.92rem}
.lrow .chev{color:var(--muted);font-size:1.4rem}
.empty{padding:1.5rem;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted);background:var(--surface)}
.empty.act{display:flex;flex-direction:column;align-items:flex-start;gap:.9rem}

.tag{display:inline-block;font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:.95rem;line-height:1;padding:.32rem .45rem .28rem;border:2px solid var(--accent);color:var(--accent-text);border-radius:4px;transform:rotate(-2deg);background:var(--accent-soft);white-space:nowrap}
.tag.big{font-size:1.35rem;padding:.4rem .55rem .34rem}

.planzone{display:flex;flex-direction:column;gap:.35rem;align-items:flex-start;width:100%;text-align:left;padding:2rem 1.25rem;border:1.5px dashed var(--muted);border-radius:12px;cursor:pointer;color:var(--ink);
  background-color:var(--surface);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px}
.planzone strong{font-size:1.1rem}
.planzone span{color:var(--muted);font-size:.95rem}
.planimg{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:zoom-in}
.planimg img{display:block;width:100%;max-height:420px;object-fit:contain}

.shead{display:flex;align-items:center;gap:1rem}
.shead .snr{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:2.4rem;line-height:1;padding-left:.7rem;border-left:6px solid var(--accent)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:.45rem .85rem;min-height:40px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.strip{display:flex;gap:.7rem;overflow-x:auto;padding-bottom:.3rem;-webkit-overflow-scrolling:touch}
.thumb{flex:0 0 auto;display:flex;flex-direction:column;gap:.3rem;width:150px;padding:0;border:0;background:none;text-align:left;cursor:pointer}
.thumb img{width:150px;height:112px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--surface-2)}
.thumb span{font-size:.72rem;color:var(--muted);word-break:break-all;line-height:1.25}
.addtile{flex:0 0 auto;width:150px;height:112px;border:1.5px dashed var(--accent);border-radius:8px;background:var(--accent-soft);color:var(--accent-text);font-weight:600;cursor:pointer;padding:.5rem;line-height:1.25}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.dt{border-collapse:collapse;width:100%;min-width:680px}
.dt th,.dt td{padding:.65rem .7rem;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line)}
.dt th{font-size:.82rem;font-weight:600;color:var(--muted);background:var(--surface-2);white-space:nowrap}
.dt tr:last-child td{border-bottom:0}
.dt tbody tr{cursor:pointer}
.dt tbody tr:active{background:var(--surface-2)}
.dt .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dt .bem{max-width:22ch;color:var(--muted);font-size:.92rem}
.dt .ph{white-space:nowrap}
.dt .ph img{width:44px;height:34px;object-fit:cover;border-radius:4px;vertical-align:middle;border:1px solid var(--line)}
.dt .ph small{color:var(--muted);margin-left:.3rem}
.missing{color:var(--danger);font-size:.85rem}

.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:.75rem 1rem calc(.75rem + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.actionbar>div{display:flex;gap:.75rem;width:100%;max-width:980px;margin:0 auto}

.overlay{position:fixed;inset:0;z-index:20;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center}
.overlay.top{z-index:50}
@media (min-width:700px){.overlay{align-items:center}}
.sheet{width:100%;max-width:640px;max-height:calc(100% - env(safe-area-inset-top,0px) - 1rem);overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:1.1rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{border-radius:16px}}
.sheet .shd{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem}
.sheet .shd h2{flex:1}
.field{display:block;margin-top:1rem}
.field>span{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:.3rem}
input[type=text],input[type=date],input:not([type]),textarea,select{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:.65rem .75rem;min-height:48px}
textarea{resize:vertical;min-height:84px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:.45rem .9rem;min-height:42px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips.lage .chip{min-height:36px;padding:.3rem .75rem;font-size:.92rem}
.dphotos{display:flex;gap:.6rem;overflow-x:auto;padding-bottom:.2rem}
.dphotos .thumb{width:120px}
.dphotos .thumb img{width:120px;height:90px}
.dphotos .addtile{width:120px;height:90px}
.sfoot{display:flex;justify-content:space-between;gap:.6rem;margin-top:1.4rem;flex-wrap:wrap}
.settings{padding:1rem;border:1px solid var(--line);border-radius:12px;background:var(--surface)}

.viewer{position:fixed;inset:0;z-index:30;background:#1E1E22;color:#EDEDEF;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.viewer .vbar{display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem}
.viewer .vbar .cap{flex:1;min-width:0;font-size:.9rem;word-break:break-all}
.viewer .vbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex}
.viewer .vbody img{margin:auto;display:block;max-width:none}
.viewer .btn{background:#2D2D33;border-color:#4A4A52;color:#EDEDEF}
.viewer .btn.accent{background:#F9AE0B;border-color:#F9AE0B;color:#2A2A2F}
.viewer .btn.danger{color:#FF8A7A;border-color:#FF8A7A}
.camstage{flex:1;position:relative;overflow:hidden;background:#000}
.camstage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.on{opacity:.7;transition:none}
.cambar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1rem;padding:.9rem 1rem}
.camthumbs{display:flex;gap:.35rem;overflow:hidden;min-height:56px;align-items:center}
.camthumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid #4A4A52;flex:0 0 auto}
.shutter{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:#F9AE0B;cursor:pointer;-webkit-tap-highlight-color:transparent}
.shutter:active{transform:scale(.94)}
.camres{justify-self:end;font-size:.82rem;color:#B5B5BC;text-align:right}
.count{font-weight:600;color:#F9AE0B;white-space:nowrap}

.pedit .vbar{flex-wrap:wrap;row-gap:.5rem}
.ptools{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}
.ptools .grp{display:inline-flex;border:1px solid #4A4A52;border-radius:9px;overflow:hidden}
.ptools .grp button{border:0;background:#2D2D33;color:#EDEDEF;min-height:42px;min-width:44px;padding:.3rem .65rem;cursor:pointer;font-weight:500}
.ptools .grp button+button{border-left:1px solid #4A4A52}
.ptools .grp button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ptools .grp button.swb{padding:.3rem .45rem}
.ptools .grp button.swb[aria-pressed="true"]{background:#55555E}
.sw{display:inline-block;width:26px;height:26px;border-radius:50%;border:3px solid transparent;vertical-align:middle}
.swb[aria-pressed="true"] .sw{border-color:#fff}
.pedit canvas{display:block;margin:auto;width:100%;height:auto;background:#fff;touch-action:none}
.toast{position:fixed;left:50%;bottom:calc(6.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:min(92vw,560px);padding:.75rem 1rem;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--danger);color:#fff}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.overlay .sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

/* ---------- Hilfsfunktionen ---------- */
const app = document.getElementById('app');
const picker = document.getElementById('picker');
const filepicker = document.getElementById('filepicker');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const natCmp = (a, b) => String(a).localeCompare(String(b), 'de', {numeric: true});
let lastStamp = 0;
const stamp = () => { const t = Math.max(Date.now(), lastStamp + 1); lastStamp = t; return t; };
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const fmtDate = d => d ? d.split('-').reverse().join('.') : '';
const ymd = d => (d || '').replace(/-/g, '') || 'ohneDatum';
const safe = s => String(s || '').trim().replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, '-') || 'x';
const sNo = n => 'S' + String(n).padStart(2, '0');
const num = s => String(s ?? '').trim().replace('.', ',');
const normNum = s => String(s ?? '').trim().replace(',', '.');
const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b);
function ab2b64(buf) { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }

let urls = [];
const blobUrl = (buf, type) => { const u = URL.createObjectURL(new Blob([buf], {type})); urls.push(u); return u; };
const thumbUrl = p => p.thumb ? blobUrl(p.thumb, 'image/jpeg') : blobUrl(p.data, p.type);

let toastTimer;
function toast(msg, err = false, ms = 3200) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false;
  clearTimeout(toastTimer); if (ms) toastTimer = setTimeout(() => t.hidden = true, ms);
}
const busy = msg => toast(msg, false, 0);

const loaded = {};
function loadScript(k) {
  return loaded[k] ||= new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = LIBS[k];
    s.onload = res;
    s.onerror = () => { delete loaded[k]; rej(new Error('Eine Programmbibliothek konnte nicht geladen werden. Für Export und PDF-Pläne ist eine Internetverbindung nötig.')); };
    document.head.appendChild(s);
  });
}

/* ---------- Datenbank (IndexedDB, nur auf diesem Gerät) ---------- */
let dbp;
function openDB() {
  return dbp ||= new Promise((res, rej) => {
    const r = indexedDB.open('bws-erfassung', 2);
    r.onupgradeneeded = e => {
      const d = r.result;
      if (e.oldVersion < 1) {
        d.createObjectStore('projects', {keyPath: 'id'});
        const s = d.createObjectStore('sections', {keyPath: 'id'}); s.createIndex('projectId', 'projectId');
        const m = d.createObjectStore('damages', {keyPath: 'id'}); m.createIndex('sectionId', 'sectionId'); m.createIndex('projectId', 'projectId');
        const p = d.createObjectStore('photos', {keyPath: 'id'}); p.createIndex('sectionId', 'sectionId'); p.createIndex('projectId', 'projectId'); p.createIndex('damageId', 'damageId');
      }
      if (e.oldVersion < 2) d.createObjectStore('settings');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function tx(store, mode, fn) {
  const d = await openDB();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode); const st = t.objectStore(store);
    let out; const r = fn(st); if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Speichern fehlgeschlagen. Ist der Gerätespeicher voll?'));
  });
}
const put = (s, v) => tx(s, 'readwrite', st => st.put(v));
const get = (s, k) => tx(s, 'readonly', st => st.get(k));
const del = (s, k) => tx(s, 'readwrite', st => st.delete(k));
const all = s => tx(s, 'readonly', st => st.getAll());
const byIdx = (s, i, v) => tx(s, 'readonly', st => st.index(i).getAll(v));
const keysIdx = (s, i, v) => tx(s, 'readonly', st => st.index(i).getAllKeys(v));
const countIdx = (s, i, v) => tx(s, 'readonly', st => st.index(i).count(v));
const getSet = k => tx('settings', 'readonly', st => st.get(k));
const putSet = (k, v) => tx('settings', 'readwrite', st => st.put(v, k));

const sectionsOf = async pid => (await byIdx('sections', 'projectId', pid)).sort((a, b) => natCmp(a.nr, b.nr));
const damagesOf = async sid => (await byIdx('damages', 'sectionId', sid)).sort((a, b) => a.no - b.no);
const photosOf = async sid => (await byIdx('photos', 'sectionId', sid)).sort((a, b) => a.createdAt - b.createdAt);

async function deleteMany(store, index, value) { for (const k of await keysIdx(store, index, value)) await del(store, k); }
async function deleteDamage(id) { await deleteMany('photos', 'damageId', id); await del('damages', id); }
async function deleteSection(id) { await deleteMany('photos', 'sectionId', id); await deleteMany('damages', 'sectionId', id); await del('sections', id); }
async function deleteProject(id) { await deleteMany('photos', 'projectId', id); await deleteMany('damages', 'projectId', id); await deleteMany('sections', 'projectId', id); await del('projects', id); }

/* ---------- Dateinamen nach Schema ---------- */
function nameMap(P, S, photos, damages) {
  const base = ymd(P.datum) + '_' + safe(P.nr) + '_' + safe(bnr(P)) + '_' + safe(S.nr);
  const dmg = Object.fromEntries(damages.map(d => [d.id, d]));
  const map = {}; let ue = 0; const per = {};
  for (const p of photos) {
    if (p.kind === 'overview') { ue++; map[p.id] = base + '_UE' + String(ue).padStart(2, '0'); }

/* ---------- Bilder ---------- */
async function toCanvas(blob, max) {
  const url = URL.createObjectURL(blob);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth * s)); c.height = Math.max(1, Math.round(img.naturalHeight * s));
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    return c;
  } finally { URL.revokeObjectURL(url); }
}
const canvasBlob = (c, q) => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Bild konnte nicht verarbeitet werden.')), 'image/jpeg', q));
async function makeThumb(blob) { try { return await (await canvasBlob(await toCanvas(blob, 480), .72)).arrayBuffer(); } catch (e) { return null; } }
async function storePhoto(file, meta) {
  const data = await file.arrayBuffer();
  const p = {id: uid(), ...meta, damageId: meta.damageId || '', type: file.type || 'image/jpeg', data, thumb: await makeThumb(file), createdAt: stamp()};
  await put('photos', p); return p;
}

/* ---------- Fotoquelle: Serienkamera, iPad-Kamera, Mediathek ---------- */
let source = 'serie';
let pending = null;
function pick({multiple = false} = {}, handler) {
  picker.accept = 'image/*';
  if (source === 'camera') picker.setAttribute('capture', 'environment'); else picker.removeAttribute('capture');
  picker.multiple = multiple && source === 'library';
  pending = handler; picker.click();
}
picker.addEventListener('change', async () => {
  const files = [...picker.files]; picker.value = ''; const h = pending; pending = null;
  if (files.length && h) { try { await h(files); } catch (e) { toast(e.message || String(e), true); } }
});
let pendingFile = null;
function pickFile(accept, handler, multiple = false) { filepicker.accept = accept; filepicker.multiple = multiple; pendingFile = handler; filepicker.click(); }
filepicker.addEventListener('change', async () => {
  const fs = [...filepicker.files]; filepicker.value = ''; const h = pendingFile; pendingFile = null;
  if (fs.length && h) { try { await h(filepicker.multiple ? fs : fs[0]); } catch (e) { toast(e.message || String(e), true, 6000); } }
});
function updateSeg() { document.querySelectorAll('[data-act="src"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === source))); }

function seriesCamera(title) {
  return new Promise(async (resolve, reject) => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { reject(new Error('nosupport')); return; }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: {ideal: 'environment'}, width: {ideal: 4096}, height: {ideal: 3072}}}); }
    catch (e) { reject(e); return; }
    const shots = [], curls = [];
    const v = document.createElement('div'); v.className = 'viewer';
    v.innerHTML = '<div class="vbar"><div class="cap">' + esc(title) + '</div><span class="count">0 Fotos</span><button class="btn small" data-x="cancel">Abbrechen</button><button class="btn small accent" data-x="done">Fertig</button></div>' +
      '<div class="camstage"><video playsinline autoplay muted></video><div class="flash"></div></div>' +
      '<div class="cambar"><div class="camthumbs"></div><button class="shutter" data-x="shot" aria-label="Foto aufnehmen"></button><div class="camres"></div></div>';
    document.body.appendChild(v); document.body.style.overflow = 'hidden';
    const video = v.querySelector('video'); video.srcObject = stream;
    try { await video.play(); } catch (e) {}
    const res = () => { if (video.videoWidth) v.querySelector('.camres').textContent = video.videoWidth + ' × ' + video.videoHeight + ' px'; };
    video.addEventListener('loadedmetadata', res); video.addEventListener('resize', res);
    const stop = () => { stream.getTracks().forEach(t => t.stop()); curls.forEach(u => URL.revokeObjectURL(u)); v.remove(); if (!document.querySelector('.overlay,.viewer')) document.body.style.overflow = ''; };
    let shooting = false;
    v.addEventListener('click', async e => {
      const b = e.target.closest('[data-x]'); if (!b) return; e.stopPropagation();
      if (b.dataset.x === 'cancel') {
        if (shots.length && !(await confirmBox(plural(shots.length, 'Foto', 'Fotos') + ' verwerfen?', 'Verwerfen'))) return;
        stop(); resolve([]);
      } else if (b.dataset.x === 'done') { stop(); resolve(shots); }
      else if (b.dataset.x === 'shot' && !shooting) {
        if (!video.videoWidth) return;
        shooting = true;
        const fl = v.querySelector('.flash'); fl.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => fl.classList.remove('on')));
        const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight;
        c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
        try {
          const blob = await canvasBlob(c, .92); shots.push(blob);
          const u = URL.createObjectURL(blob); curls.push(u);
          const im = document.createElement('img'); im.src = u; im.alt = '';
          const box = v.querySelector('.camthumbs'); box.prepend(im); while (box.children.length > 4) box.lastChild.remove();
          v.querySelector('.count').textContent = plural(shots.length, 'Foto', 'Fotos');
        } catch (err) { toast(err.message, true); }
        shooting = false;
      }
    });
  });
}
function capture(title, handler) {
  if (source === 'serie') {
    seriesCamera(title).then(files => files.length ? handler(files) : null, () => {
      source = 'camera'; updateSeg();
      toast('Die Serienkamera ist hier nicht verfügbar oder der Kamerazugriff wurde abgelehnt. Umgestellt auf iPad-Kamera, tippe bitte noch einmal.', true, 8000);
    }).catch(e => toast(e.message || String(e), true));
    return;
  }
  pick({multiple: true}, handler);
}

/* ---------- Speichern von Dateien ---------- */
const dlPromise = (window.claude && window.claude.use) ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
async function saveFile(name, blob) {
  const dl = await dlPromise;
  if (dl) {
    try { await dl.save({filename: name, data: blob}); toast('Datei gespeichert: ' + name); return true; }
    catch (e) {
      if (e && e.code === 'declined') { toast('Speichern abgebrochen.'); return false; }
      if (e && e.code === 'rate_limited') { toast('Es ist schon ein Speicherdialog offen.', true); return false; }
      if (!(e && ['unavailable','not_granted','capability_disabled','capability_removed'].includes(e.code))) { toast('Speichern fehlgeschlagen: ' + (e && e.message || e), true); return false; }
    }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  toast('Datei bereitgestellt: ' + name); return true;
}

  const secs = await sectionsOf(pid);
  let list = clone(P.annot || []); const undo = [];
  let tool = 'pen', color = PCOL[0].v, size = 'M', z = 1, cur = null, dirty = false;
  const tools = [['pen', 'Stift'], ['arrow', 'Pfeil'], ['mark', 'Marker'], ['cross', 'Kreuz'], ['text', 'Text'], ['erase', 'Löschen'], ['hand', 'Verschieben']];
  const v = document.createElement('div'); v.className = 'viewer pedit';

    '<div class="grp"><button data-x="undo">Rückgängig</button><button data-x="out" aria-label="Verkleinern">−</button><button data-x="in" aria-label="Vergrößern">+</button></div>' +
    '</div><span style="flex:1"></span><button class="btn small" data-x="cancel">Abbrechen</button><button class="btn small accent" data-x="save">Speichern</button></div>' +
    '<div class="vbody" style="background:#fff"><canvas></canvas></div>';
  document.body.appendChild(v); document.body.style.overflow = 'hidden';
  const cv = v.querySelector('canvas'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
  const redraw = () => { ctx.drawImage(base, 0, 0); drawAnnot(ctx, list, W, H); if (cur) drawAnnot(ctx, [cur], W, H); };

  if (P.plan && !onlySid) {
    doc.addPage(); doc.setFont(F, 'bold'); doc.setFontSize(14); doc.text('Abschnittsplan', M, TOP + 6);
    const c = await toCanvas(new Blob([planShown(P)], {type: 'image/jpeg'}), 2600);
    const r = c.height / c.width; let w = W, h = w * r; const maxH = BOTTOM - (TOP + 12); if (h > maxH) { h = maxH; w = h / r; }
    doc.addImage(c.toDataURL('image/jpeg', .85), 'JPEG', M + (W - w) / 2, TOP + 11, w, h);
  }

  // Abschnitte
  let firstSec = 0;
  for (const s of secs) {
    doc.addPage(); if (!firstSec) firstSec = doc.getNumberOfPages();
    let y = TOP + 6;
    doc.setFont(F, 'bold'); doc.setFontSize(14); doc.setTextColor(0);
    doc.text('Abschnitt ' + s.nr + (s.name ? ' – ' + s.name : ''), M, y);
    const dm = await damagesOf(s.id), ph = await photosOf(s.id), names = nameMap(P, s, ph, dm);
    const fotos = d => ph.filter(p => p.damageId === d.id).map(p => names[p.id]).join('\n');
    if (dm.length) {
      doc.autoTable({...TS, startY: y + 4, styles: {...TS.styles, fontSize: 8.5, cellPadding: 1.2}, headStyles: {...TS.headStyles, fontSize: 8},
        head: [['B-Nr.', 'S-Nr.', 'S-Art', 'Lage', 'Länge\n[cm]', 'Breite\n[mm]', 'Bemerkung', 'Foto']],
        body: dm.map(d => [bnr(P), sNo(d.no), artCode(d.art), d.lage || '', num(d.laenge), num(d.breite), d.bem || '', fotos(d)]),
        columnStyles: {0: {cellWidth: 10, halign: 'center'}, 1: {cellWidth: 10, halign: 'center'}, 2: {cellWidth: 10, halign: 'center'}, 3: {cellWidth: 26}, 4: {cellWidth: 12, halign: 'right'}, 5: {cellWidth: 12, halign: 'right'}, 7: {cellWidth: 48, fontSize: 6.5}}});
      y = doc.lastAutoTable.finalY + 8;
    } else {
      doc.setFont(F, 'normal'); doc.setFontSize(10); doc.text('Keine Schäden festgestellt.', M, y + 9); y += 16;
    }
    const dmgById = Object.fromEntries(dm.map(d => [d.id, d]));
    const ov = ph.filter(p => p.kind === 'overview');
    const dp = dm.flatMap(d => ph.filter(p => p.damageId === d.id));
    y = await placePhotos(ov, 'Übersichtsfotos', p => names[p.id], y);
    y = await placePhotos(dp, 'Schadensfotos', p => { const d = dmgById[p.damageId]; return names[p.id] + (d.art ? '   ' + artCode(d.art) + ': ' + d.art : ''); }, y);
  }

  // Kopf- und Fußzeile
  const n = doc.getNumberOfPages();
  const hdr2 = (P.begehung || 'Begehung') + ' vom ' + fmtDate(P.datum);
  const logo = LOGOS[P.firma] || LOGOS.dibauco;
  const legend = ARTEN.map(a => a.c + ': ' + (a.l || a.n));
  const legLines = []; for (let i = 0; i < legend.length; i += 3) legLines.push(legend.slice(i, i + 3).join('   –   '));
  doc.setFont(F, 'normal'); doc.setFontSize(8);
  const nameLines = P.name ? doc.splitTextToSize(String(P.name), 80) : [];
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setTextColor(0);
    doc.addImage(logo.src, 'PNG', M, 10, 11 * logo.ratio, 11, 'logo-' + (P.firma || 'dibauco'), 'FAST');
    doc.setFont(F, 'bold'); doc.setFontSize(10); doc.text(String(P.nr || ''), M + W, 13, {align: 'right'});
    doc.setFont(F, 'normal'); doc.setFontSize(9); doc.text(hdr2, M + W, 17.5, {align: 'right'});
    if (P.adresse) doc.text(String(P.adresse), M + W, 22, {align: 'right', maxWidth: 110});
    doc.setDrawColor(0); doc.setLineWidth(.2); doc.line(M, 25.5, M + W, 25.5);
    doc.line(M, 277.5, M + W, 277.5);
    doc.setFontSize(6.5); doc.setTextColor(60);
    if (firstSec && i >= firstSec) legLines.forEach((l, k) => doc.text(l, M, 281 + k * 2.7));
    doc.setFontSize(8); doc.setTextColor(60);
    doc.text('Seite ' + i + ' von ' + n, 105, 291, {align: 'center'});
    nameLines.slice(-3).forEach((l, k, arr) => doc.text(l, M + W, 291 - (arr.length - 1 - k) * 3.3, {align: 'right'}));
    doc.setTextColor(0);
  }
  const S1 = onlySid && secs[0];
  const fname = ymd(P.datum) + '_' + safe(P.nr) + (S1 ? '_' + safe(S1.nr) : '') + '_' + safe(P.begehung) + '.pdf';
  busy('PDF wird gespeichert …');
  await saveFile(fname, doc.output('blob'));

  async function placePhotos(list, title, caption, y) {
    if (!list.length) return y;
    const gap = 4, colW = (W - gap) / 2, maxH = 78;
    if (y + 10 + maxH + 8 > BOTTOM) { doc.addPage(); y = TOP + 4; }
    doc.setFont(F, 'bold'); doc.setFontSize(11); doc.text(title, M, y); y += 4;
    let col = 0, rowH = 0;
    for (const p of list) {
      if (col === 0 && y + maxH + 8 > BOTTOM) { doc.addPage(); y = TOP + 2; }
      const x = M + col * (colW + gap);
      let h = 40;
      try {
        const c = await toCanvas(new Blob([p.data], {type: p.type}), 1600);
        const r = c.height / c.width; let w = colW; h = w * r; if (h > maxH) { h = maxH; w = h / r; }
        doc.addImage(c.toDataURL('image/jpeg', .8), 'JPEG', x, y, w, h);
      } catch (e) {
        doc.setDrawColor(150); doc.rect(x, y, colW, h); doc.setFont(F, 'normal'); doc.setFontSize(8); doc.text('Bild nicht darstellbar', x + 3, y + 6);
      }
      doc.setFont(F, 'normal'); doc.setFontSize(7.5); doc.text(caption(p), x, y + h + 3.8, {maxWidth: colW});
      rowH = Math.max(rowH, h + 7); col++;
      if (col === 2) { col = 0; y += rowH + 3; rowH = 0; }
      tick();
    }
    if (col === 1) y += rowH + 3;
    return y + 3;
  }
}

/* ---------- ZIP-Export und -Import ---------- */
const csvCell = v => { const s = String(v ?? ''); return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
async function exportZIP(pid) {
  busy('ZIP wird vorbereitet …');
  await loadScript('jszip');
  const zip = new window.JSZip();
  const P = await get('projects', pid); const secs = await sectionsOf(pid);
  const meta = {format: 'bws-erfassung', version: 1, exported: new Date().toISOString(), project: {...P, plan: undefined, planOut: undefined}, sections: [], damages: [], photos: []};
  const csv = [['Abschnitt', 'Bezeichnung', 'B-Nr.', 'S-Nr.', 'S-Art', 'Schadensart', 'Lage', 'Länge [cm]', 'Breite [mm]', 'Bemerkung', 'Dateien']];
  if (P.plan) zip.file('Abschnittsplan.jpg', P.plan);
  if (P.planOut) zip.file('Abschnittsplan_beschriftet.jpg', P.planOut);
  for (const s of secs) {
    const dm = await damagesOf(s.id), ph = await photosOf(s.id), names = nameMap(P, s, ph, dm);
    const folder = safe(s.nr) + (s.name ? '_' + safe(s.name) : '');
    meta.sections.push(s); dm.forEach(d => meta.damages.push(d));
    for (const p of ph) {
      const path = folder + '/' + names[p.id] + '.' + extOf(p);
      zip.file(path, p.data, {date: new Date(Math.floor(p.createdAt))});
      meta.photos.push({...p, data: undefined, thumb: undefined, path});
    }
    const ov = ph.filter(p => p.kind === 'overview').map(p => names[p.id]).join(', ');
    csv.push([s.nr, s.name, bnr(P), 'Übersicht', '', '', '', '', '', '', ov]);
    for (const d of dm) csv.push([s.nr, s.name, bnr(P), sNo(d.no), artCode(d.art), d.art, d.lage, num(d.laenge), num(d.breite), d.bem, ph.filter(p => p.damageId === d.id).map(p => names[p.id]).join(', ')]);
  }
  const root = ymd(P.datum) + '_' + safe(P.nr) + '_' + safe(bnr(P)) + '_' + safe(P.begehung);
  zip.file(root + '_Schadensliste.csv', '\ufeff' + csv.map(r => r.map(csvCell).join(';')).join('\r\n'));
  zip.file('projekt.json', JSON.stringify(meta, null, 1));
  const blob = await zip.generateAsync({type: 'blob', compression: 'STORE'}, m => busy('ZIP wird erstellt … ' + Math.round(m.percent) + ' %'));
  if (await saveFile(root + '.zip', blob)) { P.lastExport = Date.now(); await put('projects', P); render(true); }
}
async function importZIP(file) {
  busy('ZIP wird gelesen …');
  await loadScript('jszip');
  const zip = await window.JSZip.loadAsync(file);
  const jf = zip.file('projekt.json');
  if (!jf) throw new Error('In der ZIP-Datei fehlt projekt.json. Laden lassen sich nur ZIP-Dateien, die mit dieser App exportiert wurden.');
  const meta = JSON.parse(await jf.async('string'));
  if (meta.format !== 'bws-erfassung') throw new Error('Diese ZIP-Datei stammt nicht aus dieser App.');
  if (await get('projects', meta.project.id)) {
    if (!(await confirmBox('Projekt ' + meta.project.nr + ' ist auf diesem Gerät schon vorhanden. Durch den Stand aus der Datei ersetzen?', 'Ersetzen'))) { toast('Laden abgebrochen.'); return; }
    await deleteProject(meta.project.id);
  }
  const P = {...meta.project}; const pf = zip.file('Abschnittsplan.jpg'); if (pf) P.plan = await pf.async('arraybuffer');
  const pf2 = zip.file('Abschnittsplan_beschriftet.jpg'); if (pf2) P.planOut = await pf2.async('arraybuffer');
  await put('projects', P);
  for (const s of meta.sections) await put('sections', s);
  for (const d of meta.damages) await put('damages', d);
  let i = 0;
  for (const p of meta.photos) {
    i++; busy('Fotos werden geladen … ' + i + ' von ' + meta.photos.length);
    const f = zip.file(p.path); if (!f) continue;
    const data = await f.async('arraybuffer');
    const rec = {...p, data, thumb: await makeThumb(new Blob([data], {type: p.type}))}; delete rec.path;
    await put('photos', rec);
  }
  toast('Projekt ' + P.nr + ' geladen.');
  go({name: 'project', id: P.id});
}

/* ---------- Aktionen ---------- */
const ACT = {
  'home': () => go({name: 'projects'}),
  'new-project': () => projectForm(),
  'open-project': el => go({name: 'project', id: el.dataset.id}),
  'edit-project': async () => projectForm(await get('projects', view.id)),
  'upload-plan': () => { const pid = view.id; pickFile('application/pdf,image/*', f => handlePlan(f, pid)); },
  'view-plan': () => viewPlan(),
  'edit-plan': () => editPlan(),
  'new-section': () => sectionForm(view.id),
  'open-section': el => go({name: 'section', id: el.dataset.id}),
  'edit-section': async () => { const S = await get('sections', view.id); sectionForm(S.projectId, S); },
  'src': el => { source = el.dataset.v; updateSeg(); },
  'shoot-overview': () => {
    const sid = view.id;
    capture('Übersichtsfotos', async files => {
      const S = await get('sections', sid);
      for (const f of files) await storePhoto(f, {projectId: S.projectId, sectionId: sid, kind: 'overview'});
      toast(files.length === 1 ? 'Übersichtsfoto gespeichert.' : files.length + ' Übersichtsfotos gespeichert.');
      render(true);
    });
  },
  'shoot-damage': () => {
    const sid = view.id;
    capture('Neuer Schaden', async files => {
      const S = await get('sections', sid);
      const d = {id: uid(), projectId: S.projectId, sectionId: sid, no: await nextNo(sid), art: '', lage: '', laenge: '', breite: '', bem: '', createdAt: Date.now()};
      await put('damages', d);
      for (const f of files) await storePhoto(f, {projectId: S.projectId, sectionId: sid, kind: 'damage', damageId: d.id});
      await render(true); openDamage(d.id);
    });
  },
  'open-damage': el => openDamage(el.dataset.id),
  'open-photo': el => openPhoto(el.dataset.id),
  'art': el => { if (!sheet) return; sheet.art = sheet.art === el.dataset.v ? '' : el.dataset.v; sheet.o.querySelectorAll('[data-act="art"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === sheet.art))); },
  'lage': el => { if (!sheet) return; const i = sheet.o.querySelector('#f-lage'); const v = i.value.trim(); i.value = v ? v + ' ' + el.dataset.v : el.dataset.v; },
  'dmg-add-photo': () => {
    if (!sheet) return; const id = sheet.id;
    capture('Weitere Schadensfotos', async files => {
      const d = await saveDamageFields() || await get('damages', id);
      for (const f of files) await storePhoto(f, {projectId: d.projectId, sectionId: d.sectionId, kind: 'damage', damageId: d.id});
      if (sheet && sheet.id === id) await fillDamage(d);
      render(true);
    });
  },
  'dmg-done': async () => { await saveDamageFields(); closeDamage(); render(true); },
  'dmg-delete': async () => {
    if (!sheet) return; const d = await get('damages', sheet.id);
    if (await confirmBox('Schaden ' + sNo(d.no) + ' mit seinen Fotos löschen? Die Nummern der übrigen Schäden bleiben unverändert.')) { await deleteDamage(d.id); closeDamage(); render(true); }
  },
  'export-pdf': () => exportPDF(view.id),
  'export-pdf-section': async () => { const S = await get('sections', view.id); exportPDF(S.projectId, S.id); },
  'export-zip': () => exportZIP(view.id),
  'import-zip': () => pickFile('.zip,application/zip', f => importZIP(f))
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  try { Promise.resolve(fn(el)).catch(err => toast(err.message || String(err), true, 6000)); }
  catch (err) { toast(err.message || String(err), true, 6000); }
});

render();
</script>
